context: |
  Clean Architecture practice project (Uncle Bob's)
  Stack: TypeScript 7.0.2, Express 5.2.1, Vitest 4.1.10, Zod 4.4.3, pnpm
  Architecture: Clean Architecture (entities, use cases, interface adapters, frameworks & drivers)
  Source: src/ (entities/, shared/, index.ts)
  Tests: tests/ (entities/, shared/)

strict_tdd: true

testing:
  runner: vitest
  command: pnpm test
  unit_command: pnpm test:unit
  integration_command: pnpm test:integration
  coverage_command: null
  layers:
    unit: available
    integration: available
    e2e: not_configured
  tools:
    type_checker: tsc (pnpm build)
    linter: not_configured
    formatter: not_configured

phase_rules:
  proposal: required
  spec: required
  design: required
  tasks: required
  apply: required
  verify: required
  archive: required
